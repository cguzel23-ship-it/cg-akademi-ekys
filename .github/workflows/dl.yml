name: zd-indir
on:
  push:
    branches: [zd-gorseller]
    paths: ['urls.tsv']
permissions:
  contents: write
concurrency: zddl
jobs:
  dl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p audio
          while IFS=$'\t' read -r name url; do
            [ -z "$name" ] && continue
            ext="${url##*.}"; [ -s "audio/$name.$ext" ] && continue
            curl -sL --max-time 300 -o "audio/$name.$ext" "$url" || echo "FAIL $name"
          done < urls.tsv
          ls -la audio
          git config user.name zd-bot; git config user.email zd-bot@users.noreply.github.com
          git add audio; git commit -m "sesler" || exit 0; git pull --rebase -q; git push
